services:
  apache:
    image: php:8.0-apache
    container_name: php-apache
    ports:
      - "3000:80"
    volumes:
      - ./src:/var/www/html
    networks:
      - entorno-web
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reparayaapp
      MYSQL_USER: user 
      MYSQL_PASSWORD: 1234user
    networks:
      - entorno-web   
    volumes:
      - mysql-data:/var/lib/mysql
  
  app:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:  
      - "8080:80"
    environment:
      PMA_HOST: mysql
    networks:
      - entorno-web
  
networks:
  entorno-web:

volumes:
  mysql-data: